# ============================================================
#  REIT / InvIT Watch — settings
#  Edit this file on GitHub (pencil icon) to change thresholds
#  or scrips. Changes apply from the next run (next session).
# ============================================================

market:
  open: "09:15"          # IST
  close: "15:30"         # IST
  poll_minutes: 5        # how often to check during market hours
  combine_bse_volume: true      # volume = NSE + BSE together
  volume_checks_from: "10:00"   # ignore volume spikes before this (opening noise)

thresholds:
  # --- Price ---
  daily_pct: 2.0         # alert if price moves +/- this % vs previous close
  daily_step_pct: 1.0    # re-alert same day only if move grows by this much more (2% -> 3% -> 4%)
  monthly_pct: 5.0       # alert if price moves +/- this % vs close ~1 month (21 trading days) ago
  monthly_step_pct: 2.0  # re-alert only if monthly move grows by this much more (5% -> 7% -> 9%)
  monthly_lookback_days: 21

  # --- Volume (today's volume vs normal for this time of day) ---
  volume_multiple: 2.5   # alert if today's volume so far >= 2.5x the usual volume by this time
  volume_avg_days: 20    # "usual" = average daily volume over last 20 trading days
  volume_min_avg_value_lakh: 5   # skip volume checks for scrips averaging < Rs 5 lakh traded/day (too illiquid to be meaningful)

alerts:
  # Pushover priority: 0 = normal, 1 = high (loud, breaks Focus/quiet hours),
  # 2 = emergency (repeats until you tap Acknowledge)
  default_priority: 2
  emergency_if_daily_pct: 3.0       # daily move >= this -> emergency
  emergency_if_monthly_pct: 8.0     # monthly move >= this -> emergency
  emergency_if_volume_multiple: 5.0 # volume >= this multiple -> emergency
  emergency_retry_seconds: 30       # emergency alert repeats every 60s...
  emergency_expire_seconds: 3600     # ...for up to 15 min unless acknowledged
  morning_heartbeat: true           # quiet "monitor is live" message each morning

scrips:
  # Price comes from NSE whenever available. Yahoo's NSE code is SYMBOL-SERIES.NS
  # (series RR = REIT, IV = InvIT, e.g. EMBASSY-RR.NS). BSE (SYMBOL.BO) is used for
  # price only if NSE has no current data; volume is NSE + BSE combined.
  # Exact codes can be forced with nse: / bse: (e.g. bse: 535464.BO).
  # Optional per-scrip overrides: daily_pct, monthly_pct, volume_multiple
  # Set active: false to pause a scrip without deleting it.
  # REITs
  - {symbol: EMBASSY,     name: Embassy Office Parks REIT, series: RR}
  - {symbol: MINDSPACE,   name: Mindspace Business Parks REIT, series: RR}
